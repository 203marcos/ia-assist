spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb?sslmode=disable
    username: postgres
    password: postgres
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true        # cria a extensao, a tabela e o indice no primeiro start
        index-type: HNSW               # indice de busca aproximada de vizinhos
        distance-type: COSINE_DISTANCE # distancia que casa com embeddings de sentenca
        table-name: vector_store
    chat:
      memory:
        redis:
          host: localhost
          port: 6379
          time-to-live: PT30M          # a conversa expira apos 30 min de inatividade

# bloco proprio do projeto (nao e do framework)
app:
  rag:
    top-k: 4                           # quantos chunks o QuestionAnswerAdvisor recupera
    similarity-threshold: 0.5          # piso de similaridade do retrieval
  memory:
    max-messages: 20                   # tamanho da janela do MessageWindowChatMemory
  works:
    dir: src/main/resources/works      # repositorio de estudos (relativo a raiz do projeto)

logging:
  level:
    # o MessageAggregator reloga erros que o AnthropicChatModel e o ChatService
    # ja reportam com stack trace; desligado para evitar o mesmo erro repetido
    org.springframework.ai.chat.model.MessageAggregator: "OFF"
    # observabilidade do prompt (PromptLoggingAdvisor):
    #   INFO  -> silencioso (padrao)
    #   DEBUG -> resumo por chamada (conversationId, mensagens, tamanhos)
    #   TRACE -> conteudo completo do prompt e da resposta
    br.com.marcosdias.ia_assist.chat.PromptLoggingAdvisor: INFO